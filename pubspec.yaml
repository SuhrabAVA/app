name: sheet_clone
description: A Flutter project
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  # Supabase
  # 2.12.4 — минимальная версия с фиксами краша при возврате из фона:
  # #1178 (safe conn null check в onResumed), #1321 (null check в connect
  # при быстрых lifecycle-переходах), #1340 (serial Future chain).
  # Выше не идём: 2.13.0 переименовывает anon key → publishable key,
  # 2.15.0 требует Dart SDK 3.4.0 — это отдельная задача.
  supabase_flutter: 2.12.4
  supabase: ^2.3.0 
  flutter_dotenv: ^5.1.0
    

  mime: any
  # Кэширование сетевых картинок (диск-кэш на Windows/Android) — фото склада
  cached_network_image: ^3.4.1
  # Генерация миниатюр фото (чистый Dart, работает на всех платформах)
  image: ^4.2.0

  # Утилиты
  provider: ^6.1.2
  uuid: ^4.4.0
  path: ^1.9.0
  file_picker: ^8.0.0
  image_picker: ^1.1.0

  # Дата/время (эта версия совместима с Flutter 3.22+)
  intl: ^0.18.1

  # Для Web (если таргетируешь web)
  flutter_web_plugins:
    sdk: flutter
  record: ^6.1.0
  audioplayers: ^6.5.0
  url_launcher: ^6.3.2
  open_filex: ^4.3.4
  shared_preferences: ^2.2.3

  # Добавляем виджет для просмотра PDF внутри приложения
  pdfx: ^2.5.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  video_player: ^2.9.1
  http: ^1.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - .env
msix_config:
  display_name: Easy Pack Pro
  publisher_display_name: MyCompany
  identity_name: com.mycompany.myapp
  publisher: CN=MyCompany
  capabilities: internetClient